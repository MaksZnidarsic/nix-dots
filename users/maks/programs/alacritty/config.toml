


[env]
TERM = "xterm-256color"

[window]
opacity = 0.7
decorations = "None"
dynamic_title = true

[font]
size = 14
normal.family = "UbuntuMono Nerd Font"

[keyboard]
bindings = [
    {key = "Enter", mods = "Alt|Control", action = "SpawnNewInstance"}
]

[general]
import = ["~/.config/alacritty/theme.toml"]
